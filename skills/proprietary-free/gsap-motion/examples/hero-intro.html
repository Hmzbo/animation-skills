<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <style>
    html,body{margin:0;background:#0b0e14;height:720px;width:1280px;overflow:hidden}
    #stage{width:1280px;height:720px;display:flex;flex-direction:column;justify-content:center;align-items:center;font-family:Arial,sans-serif}
    #title{color:#fff;font-size:84px;font-weight:800;margin:0}
    #row{display:flex;gap:20px;margin-top:28px}
    .card{background:#16202e;color:#cbd5e1;font-size:28px;font-weight:700;padding:18px 34px;border-radius:14px}
    #bar{width:640px;height:10px;background:#1f2937;border-radius:99px;margin-top:36px}
    #barfill{width:100%;height:100%;background:#14b8a6;border-radius:99px;transform-origin:left center}
  </style>
</head>
<body>
  <div id="stage">
    <h1 id="title">GSAP in seconds</h1>
    <div id="row"><div class="card">timelines</div><div class="card">staggers</div><div class="card">eases</div></div>
    <div id="bar"><div id="barfill"></div></div>
  </div>
  <script src="/node_modules/gsap/dist/gsap.min.js"></script>
  <script src="/scene.js"></script>
</body>
</html>
